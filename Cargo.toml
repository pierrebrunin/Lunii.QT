[workspace]
resolver = "3"
members = ["lunii-core", "lunii-cli", "lunii-gui"]

[workspace.package]
version = "4.0.0-beta.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/o-daneel/Lunii.QT"

[profile.release]
# optimised for size: -5 MB (23.4 -> 18.5 MB), the app is limited by the
# device writes, not by the CPU
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# local tries of an optimised build: release without its whole-program
# optimisation (slow to build, kept for the packages)
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# line numbers only: panics still say where, smaller binary and target dir
# (`debug = true` again to inspect variables in a debugger)
[profile.dev]
debug = "line-tables-only"

# Image decoding / crypto are painfully slow in debug builds
[profile.dev.package."*"]
opt-level = 2
debug = false
